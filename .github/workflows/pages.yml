# Builds the game and publishes it to GitHub Pages (HTTPS, which WebXR and the mic need) on every
# push to the repository's default branch, whatever it is called.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# (The other source, "Deploy from a branch", publishes the raw source files, which can't run.)
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that Pages publishes from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | jq -r '.build_type // empty')
          if [ "$type" = "legacy" ]; then
            echo "::error::GitHub Pages is set to 'Deploy from a branch', which publishes the raw source files. Switch Settings -> Pages -> Source to 'GitHub Actions', then re-run this workflow."
            exit 1
          fi
          echo "Pages build type: ${type:-unknown}"
      - id: deployment
        uses: actions/deploy-pages@v4
